services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: eventforge
      POSTGRES_USER: eventforge
      POSTGRES_PASSWORD: eventforge
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventforge -d eventforge"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://eventforge:eventforge@postgres:5432/eventforge
      JWT_SECRET: change-me-in-production
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
